name: Bug report
description: Something doesn't work, looks wrong, or crashes.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a PDF
        2. Choose the highlighter
        3. ...
  - type: input
    id: version
    attributes:
      label: Ochre version
      description: From the release you installed, or the commit if you built it yourself.
      placeholder: "1.3.3"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Distribution and desktop
      description: Including whether it's Wayland or X11.
      placeholder: "Arch Linux, KDE Plasma 6 (Wayland)"
    validations:
      required: true
  - type: textarea
    id: pdf
    attributes:
      label: The PDF
      description: >
        If it only happens with one file, attach it or link to it if you can
        (only if it's not private), or say where it came from (e.g. "exported
        from LibreOffice").
  - type: textarea
    id: log
    attributes:
      label: Terminal output
      description: Start Ochre from a terminal (`ochre file.pdf`) and paste anything it prints.
      render: text
