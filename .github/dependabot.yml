version: 2
updates:
  # Most dependencies are 0.x, where a minor bump (0.36 -> 0.37) can break the
  # build, so only patch updates are grouped; other updates get a pull request
  # each. The egui crates have to move together, so they're grouped.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      egui:
        patterns: ["eframe", "egui*"]
      patch:
        update-types: [patch]
    ignore:
      # resvg must be the version egui_extras uses (its SVG loader takes
      # resvg's options type), so it moves by hand together with egui.
      - dependency-name: resvg
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
