# Pushing a tag vX.Y.Z builds the Linux archive and attaches it to the release
# for that tag, creating a draft release if there isn't one yet. Write the notes
# and publish it on GitHub (or create the release with notes first; the
# archive is then added to it).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Same build as vendor/pdfium/VERSION.
  PDFIUM_TAG: chromium/8076

jobs:
  linux:
    name: Linux x86_64 archive
    # The oldest supported runner: its older glibc lets the binary run on more distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - name: Download pdfium
        run: |
          mkdir -p vendor/pdfium
          curl -fsSL "https://github.com/bblanchon/pdfium-binaries/releases/download/${PDFIUM_TAG}/pdfium-linux-x64.tgz" \
            | tar -xz -C vendor/pdfium

      - name: Test
        run: cargo test --locked

      - name: Build the archive
        run: ./packaging/make-tarball.sh

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --verify-tag --title "Ochre ${tag#v}" --notes "Release notes to come."
          fi
          gh release upload "$tag" dist/*.tar.gz dist/*.tar.gz.sha256 --clobber
